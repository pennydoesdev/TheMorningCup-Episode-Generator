# Optional: stitches the weekly Morning Cup: Weekly Rewind chunks with ffmpeg.
# Triggered manually with the episode date (YYYY-MM-DD, Sunday of publication)
# and the public R2 base URL. Downloads files.txt + chunks, runs ffmpeg
# concat, and uploads the stitched MP3 as a workflow artifact.
#
# This workflow is OPTIONAL. The Cloudflare Worker does not depend on it.
name: Stitch Weekly Rewind
on:
  workflow_dispatch:
    inputs:
      episode_date:
        description: "Episode date (YYYY-MM-DD, Sunday of publication)"
        required: true
      r2_public_base_url:
        description: "R2 public base URL (no trailing slash)"
        required: true

jobs:
  stitch:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download files.txt and chunks
        env:
          DATE: ${{ inputs.episode_date }}
          BASE: ${{ inputs.r2_public_base_url }}
        run: |
          set -euo pipefail
          mkdir -p episode && cd episode
          urlencode() { jq -rn --arg s "$1" '$s|@uri'; }
          ENC_DATE=$(urlencode "$DATE")
          BASE_NO_SLASH="${BASE%/}"
          # files.txt
          FILES_NAME="The Morning Cup - Weekly Rewind - $DATE - files.txt"
          curl -fSL -o "$FILES_NAME" "$BASE_NO_SLASH/weekly-cup/$ENC_DATE/$(urlencode "$FILES_NAME")"
          # chunks
          while IFS= read -r line; do
            name=$(printf '%s' "$line" | sed -E "s/^file '(.*)'$/\\1/")
            [ -z "$name" ] && continue
            curl -fSL -o "$name" "$BASE_NO_SLASH/weekly-cup/$ENC_DATE/chunks/$(urlencode "$name")"
          done < "$FILES_NAME"

      - name: Stitch with ffmpeg
        env:
          DATE: ${{ inputs.episode_date }}
        run: |
          cd episode
          OUT="The Morning Cup - Weekly Rewind - $DATE.mp3"
          ffmpeg -hide_banner -y -f concat -safe 0 -i "The Morning Cup - Weekly Rewind - $DATE - files.txt" -c copy "$OUT" \
            || ffmpeg -hide_banner -y -f concat -safe 0 -i "The Morning Cup - Weekly Rewind - $DATE - files.txt" -acodec libmp3lame -b:a 128k "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-rewind-${{ inputs.episode_date }}
          path: episode/The Morning Cup - Weekly Rewind - ${{ inputs.episode_date }}.mp3
