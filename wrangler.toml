name = "weekly-cup-generator"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Hourly cron Sunday between 18:00 and 19:00 UTC. Code checks
# America/New_York local time and only runs once when the local
# weekday is Sunday and the local hour is 14 / 2 PM (handles DST).
# This produces a finished episode by ~2:15 PM ET — well before
# the 6 PM ET publication target.
[triggers]
crons = ["0 18-19 * * 0"]

[[r2_buckets]]
binding = "WEEKLY_CUP_BUCKET"
bucket_name = "weekly-cup"

[[kv_namespaces]]
binding = "WEEKLY_CUP_KV"
id = "REPLACE_ME"

[vars]
OPENAI_MODEL = "gpt-5-mini"
ELEVENLABS_MODEL_ID = "eleven_multilingual_v2"
ELEVENLABS_OUTPUT_FORMAT = "mp3_44100_128"
WORKER_TIMEZONE = "America/New_York"
WORKER_RUN_HOUR = "14"
WORKER_RUN_WEEKDAY = "Sunday"
MIN_SCRIPT_WORDS = "6400"
TARGET_SCRIPT_WORDS_MIN = "6400"
TARGET_SCRIPT_WORDS_MAX = "7200"
MAX_SCRIPT_WORDS = "7500"
WORDS_PER_MINUTE = "145"
MAX_TTS_CHARS_PER_CHUNK = "2500"
ENABLE_EMAIL = "false"
ENABLE_SOURCE_DIGEST = "true"
ENABLE_REPAIR_PASS = "true"
STRIP_PACING_TAGS_FOR_TTS = "true"
STATUS_PUBLIC = "false"
EMAIL_FROM = "The Penny Tribune <weeklyrewind@yourdomain.com>"
EMAIL_TO = "your-email@example.com"
R2_PUBLIC_BASE_URL = ""
PUBLISHER = "The Penny Tribune"
COPYRIGHT_HOLDER = "The Penny Tribune"
PODCAST_GENRE = "News"
VOICE_STABILITY = "0.35"
VOICE_SIMILARITY_BOOST = "0.85"
VOICE_STYLE = "0.7"
VOICE_USE_SPEAKER_BOOST = "true"

# Secrets (set with wrangler secret put):
#   OPENAI_API_KEY
#   ELEVENLABS_API_KEY
#   ELEVENLABS_VOICE_ID
#   RESEND_API_KEY
#   RUN_SECRET
