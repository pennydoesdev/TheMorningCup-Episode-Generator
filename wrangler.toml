name = "themorningcupgenerator"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Cron disabled — worker only runs on manual POST /run requests.
# To re-enable, uncomment the [triggers] block below. The scheduled
# handler in src/index.ts already guards against double-runs, DST, and
# already-completed days, so re-enabling is safe.
#
# [triggers]
# crons = ["0 9-11 * * *"]

[[r2_buckets]]
binding = "MORNING_CUP_BUCKET"
bucket_name = "vicinity"

[[kv_namespaces]]
binding = "MORNING_CUP_KV"
id = "b7de93b7b4354feda82968f7fa76a297"

[vars]
OPENAI_MODEL = "gpt-5.5"
ELEVENLABS_MODEL_ID = "eleven_multilingual_v2"
ELEVENLABS_OUTPUT_FORMAT = "mp3_44100_192"
WORKER_TIMEZONE = "America/New_York"
MIN_SCRIPT_WORDS = "2175"
TARGET_SCRIPT_WORDS_MIN = "2610"
TARGET_SCRIPT_WORDS_MAX = "2900"
MAX_SCRIPT_WORDS = "4350"
WORDS_PER_MINUTE = "145"
MAX_TTS_CHARS_PER_CHUNK = "5000"
ENABLE_SOURCE_DIGEST = "true"
ENABLE_REPAIR_PASS = "true"
# Set to "true" to pause before TTS and wait for WordPress editorial approval.
# When enabled, /run stops at awaiting_approval; WordPress calls /approve to continue.
ENABLE_APPROVAL_GATE = "false"
STRIP_PACING_TAGS_FOR_TTS = "true"
STATUS_PUBLIC = "false"
R2_PUBLIC_BASE_URL = ""
PUBLISHER = "Fold 42"
COPYRIGHT_HOLDER = "Fold 42"
PODCAST_GENRE = "News"
HOST_NAME = "Penelope Rose"
SHOW_TITLE = "The Morning Cup"
R2_KEY_PREFIX = "Generators/Podcasts/TheMorningCup"

# WordPress / VNewsOS Auto-Episode integration
# WORDPRESS_PODCAST_ID — the WP post ID of the parent vicinity_podcast post.
#   Find it in WP Admin → Podcasts → your show → ID in the URL bar.
#   Leave "0" until the show post is created; the import block will show a placeholder.
WORDPRESS_PODCAST_ID = "2616"

# CDN URLs for the final stitched MP3.
# Both fields are written into Metadata.txt so the Auto-Episode import block
# populates both _vicinity_audio_url (new) and _vnews_ep_audio_url (legacy).
# VNewsOS resolves audio in this order: _vicinity_audio_url → _vnews_ep_audio_url
# so the new CDN wins once it's live, and the old one stays as a working fallback
# during migration. Once fully migrated, clear AUDIO_CDN_BASE_URL_LEGACY.
#
# New CDN (not yet live — set this when cdn.fold42.com is ready):
AUDIO_CDN_BASE_URL = "https://cdn.fold42.com/podcasts/morning-cup"
# Legacy CDN (currently live — keep until migration is complete):
AUDIO_CDN_BASE_URL_LEGACY = "https://cdn.vicinitynews.com/podcasts/morning-cup"

# WORDPRESS_CATEGORIES — comma-separated default category names for episode posts.
#   The Auto-Episode block looks up (or creates) each name and passes the IDs
#   as the top-level "categories" array in the REST API call.
WORDPRESS_CATEGORIES = "News, The Morning Cup"
VOICE_STABILITY = "0.28"
VOICE_SIMILARITY_BOOST = "0.85"
VOICE_STYLE = "0.45"
VOICE_USE_SPEAKER_BOOST = "true"

# WordPress / VNewsOS Approval Desk integration
# These vars enable the worker to notify the WordPress editorial approval desk
# when a script is ready for review (notify) and when TTS is complete (notify-generated).
# Set ENABLE_APPROVAL_GATE = "true" to pause before TTS until WordPress calls /approve.
#
# WORDPRESS_SITE_URL   — your WP site root, no trailing slash (e.g. https://thefold42.com)
# WORDPRESS_APP_USER   — WP username that owns the Application Password
# WORKER_PUBLIC_URL    — this worker's public URL (sent to WP so it can call /approve or /reject)
#
# Application Password is a secret — set it with:
#   npx wrangler secret put WORDPRESS_APP_PASSWORD
WORDPRESS_SITE_URL = "https://thefold42.com"
WORDPRESS_APP_USER = "systems"
WORKER_PUBLIC_URL = "https://themorningcupgenerator.itsmiarosemathews.workers.dev"

# Secrets (set with wrangler secret put):
#   OPENAI_API_KEY
#   ELEVENLABS_API_KEY
#   ELEVENLABS_VOICE_ID
#   RUN_SECRET
#   WORDPRESS_APP_PASSWORD  ← Application Password for the wp-app-user above
