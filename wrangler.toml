name = "morning-cup-generator"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Hourly cron between 09:00 and 11:00 UTC. Code checks America/New_York
# local time and only runs once when the local hour is 5 (handles DST).
[triggers]
crons = ["0 9-11 * * *"]

[[r2_buckets]]
binding = "MORNING_CUP_BUCKET"
bucket_name = "morning-cup"

[[kv_namespaces]]
binding = "MORNING_CUP_KV"
id = "b7de93b7b4354feda82968f7fa76a297"

[vars]
OPENAI_MODEL = "gpt-4.1"
ELEVENLABS_MODEL_ID = "eleven_multilingual_v2"
ELEVENLABS_OUTPUT_FORMAT = "mp3_44100_128"
WORKER_TIMEZONE = "America/New_York"
MIN_SCRIPT_WORDS = "3300"
TARGET_SCRIPT_WORDS_MIN = "3300"
TARGET_SCRIPT_WORDS_MAX = "3700"
MAX_SCRIPT_WORDS = "3900"
WORDS_PER_MINUTE = "145"
MAX_TTS_CHARS_PER_CHUNK = "2500"
ENABLE_EMAIL = "true"
ENABLE_SOURCE_DIGEST = "true"
ENABLE_REPAIR_PASS = "true"
STRIP_PACING_TAGS_FOR_TTS = "true"
STATUS_PUBLIC = "false"
EMAIL_FROM = "The Penny Tribune <morningcup@yourdomain.com>"
EMAIL_TO = "your-email@example.com"
R2_PUBLIC_BASE_URL = ""
VOICE_STABILITY = "0.35"
VOICE_SIMILARITY_BOOST = "0.85"
VOICE_STYLE = "0.7"
VOICE_USE_SPEAKER_BOOST = "true"

# Secrets (set with wrangler secret put):
#   OPENAI_API_KEY
#   ELEVENLABS_API_KEY
#   ELEVENLABS_VOICE_ID
#   RESEND_API_KEY
#   RUN_SECRET
