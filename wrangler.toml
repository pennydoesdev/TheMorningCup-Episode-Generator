name = "themorningcupgenerator"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Cron disabled — worker only runs on manual POST /run requests.
# To re-enable, uncomment the [triggers] block below. The scheduled
# handler in src/index.ts already guards against double-runs, DST, and
# already-completed days, so re-enabling is safe.
#
# [triggers]
# crons = ["0 9-11 * * *"]

[[r2_buckets]]
binding = "MORNING_CUP_BUCKET"
bucket_name = "vicinity"

[[kv_namespaces]]
binding = "MORNING_CUP_KV"
id = "b7de93b7b4354feda82968f7fa76a297"

[vars]
OPENAI_MODEL = "gpt-5-mini"
ELEVENLABS_MODEL_ID = "eleven_multilingual_v2"
ELEVENLABS_OUTPUT_FORMAT = "mp3_44100_128"
WORKER_TIMEZONE = "America/New_York"
MIN_SCRIPT_WORDS = "2175"
TARGET_SCRIPT_WORDS_MIN = "2200"
TARGET_SCRIPT_WORDS_MAX = "2400"
MAX_SCRIPT_WORDS = "2465"
WORDS_PER_MINUTE = "145"
MAX_TTS_CHARS_PER_CHUNK = "2500"
ENABLE_SOURCE_DIGEST = "true"
ENABLE_REPAIR_PASS = "true"
STRIP_PACING_TAGS_FOR_TTS = "true"
STATUS_PUBLIC = "false"
R2_PUBLIC_BASE_URL = ""
PUBLISHER = "Vicinity News"
COPYRIGHT_HOLDER = "Vicinity News"
PODCAST_GENRE = "News"
HOST_NAME = "Penelope Rose"
VOICE_STABILITY = "0.35"
VOICE_SIMILARITY_BOOST = "0.85"
VOICE_STYLE = "0.7"
VOICE_USE_SPEAKER_BOOST = "true"

# Secrets (set with wrangler secret put):
#   OPENAI_API_KEY
#   ELEVENLABS_API_KEY
#   ELEVENLABS_VOICE_ID
#   RUN_SECRET
